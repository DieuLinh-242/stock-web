<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mô phỏng giá cổ phiếu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    body { margin:0; background:#000000; color:#74a5ff; font-family:'Playfair Display',Arial,sans-serif; text-align:center; }
    header { padding:24px 16px 8px; }
    h1 { margin:0 0 8px; font-size:1.8rem; font-family:'Playfair Display',Georgia,serif; }
    p { margin:0; color:#bedcfc; }
    video { width:95%; max-width:950px; margin:20px 0; border-radius:8px; }
    footer { padding:16px; color:#bedcfc; font-size:.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>Giá cổ phiếu trong 365 ngày</h1>
    <p>Biên độ giá ±10% so với giá tham chiếu</p>
  </header>
  <video controls preload="metadata">
    <source src="stock.mp4" type="video/mp4">
  </video>
  <footer>Thực hiện bởi: Trần Nguyễn Diệu Linh</footer>
</body>
</html>
